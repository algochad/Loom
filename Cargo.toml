[workspace]
resolver = "3"
members = ["crates/*", "backends/*", "mods/*", "mods/base/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.90"

[workspace.dependencies]
loom_abi = { path = "crates/abi" }
loom_sdk = { path = "crates/sdk" }
loom_noise = { path = "crates/noise" }
loom_render = { path = "crates/render" }
loom_engine = { path = "crates/engine" }
loom_vulkan = { path = "backends/vulkan" }
base_api = { path = "mods/base/api" }

ash = "0.38"
ash-window = "0.13"
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
winit = "0.30"
raw-window-handle = "0.6"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
glam = { version = "0.34", features = ["bytemuck", "mint-05"] }
bytemuck = { version = "1", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
rayon = "1"
parking_lot = "0.13"
crossbeam-channel = "0.5"
libloading = "0.9"
lz4_flex = "0.14"
png = "0.18"
rustc-hash = "2"
arboard = { version = "3", default-features = false }
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
kira = { version = "0.12.5", default-features = false, features = ["cpal", "wav", "pcm", "ogg", "vorbis"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
